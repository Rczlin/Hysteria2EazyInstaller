name: Apply Hysteria 2 URI compatibility fix

on:
  push:
    branches:
      - fix/hysteria2-uri-compatibility
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/hysteria2-uri-compatibility

      - name: Patch URI generation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Hy2Installer.sh")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  'client_url_output=""\nclash_line_output=""',
                  'client_url_output=""\nclient_url_compat_output=""\nclash_line_output=""',
              ),
              (
                  '''    # URL编码密码
    encoded_pwd=$(urlencode "$auth_pwd")
    
    # 生成订阅链接 - 按照标准格式
    if [[ -n $firstport && -n $endport ]]; then
        # 端口跳跃模式
        client_url_output="hysteria2://${encoded_pwd}@${last_ip}:${server_port_string}?security=tls&insecure=${insecure}&sni=${hy_domain}#Hysteria2"
    else
        # 单端口模式
        client_url_output="hysteria2://${encoded_pwd}@${last_ip}:${port}?security=tls&insecure=${insecure}&sni=${hy_domain}#Hysteria2"
    fi
''',
                  '''    # URL 编码认证信息与 SNI
    encoded_pwd=$(urlencode "$auth_pwd")
    encoded_sni=$(urlencode "$hy_domain")

    # 生成官方 Hysteria 2 URI。
    # hy2:// 与 hysteria2:// 均属于官方协议名，但 hy2:// 的第三方客户端兼容性更好。
    if [[ -n $firstport && -n $endport ]]; then
        # 官方端口跳跃格式；部分只接受纯数字端口的客户端可使用下方单端口兼容链接。
        client_url_output="hy2://${encoded_pwd}@${last_ip}:${server_port_string}/?insecure=${insecure}&sni=${encoded_sni}#Hysteria2"
        client_url_compat_output="hy2://${encoded_pwd}@${last_ip}:${port}/?insecure=${insecure}&sni=${encoded_sni}#Hysteria2-Single-Port"
    else
        client_url_output="hy2://${encoded_pwd}@${last_ip}:${port}/?insecure=${insecure}&sni=${encoded_sni}#Hysteria2"
        client_url_compat_output=""
    fi
''',
              ),
              (
                  '''    yellow "Hysteria 2 节点分享链接如下"
    red "$client_url_output"
    if [[ -n $clash_line_output ]]; then
''',
                  '''    yellow "Hysteria 2 官方节点分享链接如下"
    red "$client_url_output"
    if [[ -n $client_url_compat_output ]]; then
        yellow "单端口兼容链接（客户端不支持端口范围时使用，会关闭客户端端口跳跃）"
        red "$client_url_compat_output"
    fi
    if [[ -n $clash_line_output ]]; then
''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f"Expected block not found: {old[:80]!r}")
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")
          PY

          bash -n Hy2Installer.sh
          grep -q 'client_url_output="hy2://' Hy2Installer.sh
          grep -q 'client_url_compat_output="hy2://' Hy2Installer.sh
          ! grep -q 'security=tls' Hy2Installer.sh
          grep -q '/?insecure=' Hy2Installer.sh

          rm -f .github/workflows/apply-hy2-uri-fix.yml

      - name: Commit patched installer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Hy2Installer.sh .github/workflows/apply-hy2-uri-fix.yml
          git commit -m "Fix Hysteria 2 share URI compatibility"
          git push origin HEAD:fix/hysteria2-uri-compatibility
